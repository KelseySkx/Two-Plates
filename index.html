<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16120F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Two Plates</title>
<style>html,body{margin:0;height:100%;overflow:hidden}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, content scrolls, tab bar pinned to the bottom of the column */
:root{
  --bg:#F6F3F0; --surface:#FFFFFF; --fg:#22191A; --muted:#786C64; --line:#E9E2DB;
  --accent:#E8743B; --accent-ink:#B3501E; --accent-soft:#FCEADF; --accent-fg:#2B1406; --chip:#F1ECE7; --btn:#E8743B; --on-btn:#FFFFFF;
  --easy:#2F8F6B; --easy-bg:#E3F4EC; --mid:#B07A12; --mid-bg:#FBF0D9; --hard:#C2492E; --hard-bg:#FBE6E0; --xhard:#8E2D5E; --xhard-bg:#F7E1EC;
  --scrim:rgba(20,18,30,.42); --desk:#ECE5DE;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16120F; --surface:#221C18; --fg:#F5EEE8; --muted:#A99A8F; --line:#3A302A;
  --accent:#EF8450; --accent-ink:#F5A77E; --accent-soft:#3B2417; --accent-fg:#1E0E05; --chip:#2E2621; --btn:#E8743B; --on-btn:#FFFFFF;
  --easy:#6FD3A8; --easy-bg:#1C3329; --mid:#E9B95A; --mid-bg:#3A2E15; --hard:#F08A6E; --hard-bg:#3D211A; --xhard:#E78BB9; --xhard-bg:#3A1B2B;
  --scrim:rgba(0,0,0,.6); --desk:#0D0A08; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16120F; --surface:#221C18; --fg:#F5EEE8; --muted:#A99A8F; --line:#3A302A;
  --accent:#EF8450; --accent-ink:#F5A77E; --accent-soft:#3B2417; --accent-fg:#1E0E05; --chip:#2E2621; --btn:#E8743B; --on-btn:#FFFFFF;
  --easy:#6FD3A8; --easy-bg:#1C3329; --mid:#E9B95A; --mid-bg:#3A2E15; --hard:#F08A6E; --hard-bg:#3D211A; --xhard:#E78BB9; --xhard-bg:#3A1B2B;
  --scrim:rgba(0,0,0,.6); --desk:#0D0A08; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
.stage{flex:1;min-height:0;position:relative;display:flex}
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px 24px;display:flex;flex-direction:column;gap:16px}
.screen>*{flex-shrink:0}
.empty{flex-shrink:1!important}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--fg);font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.e1{color:var(--easy);background:var(--easy-bg)} .e2{color:var(--mid);background:var(--mid-bg)} .e3{color:var(--hard);background:var(--hard-bg)} .e4{color:var(--xhard);background:var(--xhard-bg)}
.eoff{color:var(--muted)}
.pp{display:inline-flex;gap:2px}.pp i{width:5px;height:5px;border-radius:50%;background:var(--fg);opacity:.2}.pp i.on{opacity:.85}
.plate{border-radius:50%;object-fit:cover;background:var(--line);display:block;flex-shrink:0;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.off-plate{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1.5px dashed var(--muted);color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--btn);color:var(--on-btn);font-weight:700;font-size:19px;letter-spacing:.005em;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.link{color:var(--accent-ink);font-weight:600;font-size:13px;padding:6px 0}
/* tabs */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;padding:12px 0 14px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent-ink)}
.tabs svg{width:22px;height:22px}
/* empty state */
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center;padding:8px 0 20px}
.peek{display:flex;justify-content:center}
.peek img{width:58px;height:58px;margin-left:-14px}
.peek img:first-child{margin-left:0}
.empty p{margin:0 auto;max-width:28ch}
/* plan list */
.why{background:var(--accent-soft);color:var(--fg);border-radius:14px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.why b{color:var(--accent-ink);font-weight:600}
.days{display:flex;flex-direction:column;gap:10px}
.day{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:18px;padding:10px 14px 10px 10px;text-align:left;width:100%;border:1px solid var(--line);animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.day .plate,.day .off-plate{width:62px;height:62px}
.day .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.day .dname{font-family:var(--display);font-weight:500;font-size:18px;line-height:1.15}
.day .dlabel{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.day .chev{color:var(--muted);flex-shrink:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.flash{animation:flash .7s ease}
.day[disabled]{cursor:default}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--surface)}}
.bar{display:flex;gap:10px;align-items:center;padding:12px 18px;background:var(--bg);border-top:1px solid var(--line)}
.pill{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--accent)}.dots i.used{background:var(--line)}
.bar .btn{flex:1}
.locked-note{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
/* dishes grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}
.dish{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;padding:4px 0;border-radius:14px}
.dish .plate{width:100%;max-width:96px;aspect-ratio:1;height:auto}
.dish .n{font-size:13px;font-weight:600;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.fab{position:absolute;right:18px;bottom:18px;z-index:3;width:56px;height:56px;border-radius:50%;background:var(--btn);color:var(--on-btn);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(160,70,20,.3)}
/* add dish */
.photo-in{align-self:center;width:170px;height:170px;flex-shrink:0;aspect-ratio:1;border-radius:50%;border:2px dashed var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;overflow:hidden;background:var(--surface);position:relative}
.photo-in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-in input{position:absolute;opacity:0;width:1px;height:1px}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text]{padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px}
.efforts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.efforts button{padding:11px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.efforts button .pips{display:flex;gap:3px}.efforts .pips i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.25}.efforts .pips i.on{opacity:1}
.efforts button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.err{color:var(--hard);font-size:13px;min-height:18px}
.del{color:var(--hard);font-weight:600;font-size:14px;padding:6px;align-self:center}
.back{display:flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:14px;align-self:flex-start}
/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:5;animation:fade .2s ease}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:86%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:4px 0}
.opt .plate,.opt .off-plate{width:76px;height:76px}
.opt .n{font-size:12.5px;font-weight:600;line-height:1.2}
.opt .cost{font-size:11.5px;font-weight:600;color:var(--muted)}
.opt .cost.free{color:var(--easy)}
.opt[disabled]{opacity:.35;cursor:default}
.opt.cur .plate{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:9;white-space:nowrap;animation:fade .2s ease}

/* week switch */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px 0;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(20,18,30,.12)}
.seg .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hint{margin:-4px 0 0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.hint-grip{display:inline-flex;color:var(--fg)}
/* day column + draggable cards */
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.dcol{display:flex;flex-direction:column;align-items:center;line-height:1.1;color:var(--muted)}
.dcol .dd{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.dcol .dn{font-family:var(--display);font-size:22px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.dcol .tt{font-size:10.5px;font-weight:700;color:var(--accent-fg);background:var(--accent);border-radius:999px;padding:1px 6px;margin-top:3px}
.dcol.today .dd,.dcol.today .dn{color:var(--accent-ink)}
.card{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;position:relative;transition:box-shadow .15s,border-color .15s}
.card.dragging{z-index:4;box-shadow:0 12px 28px rgba(70,35,10,.22);border-color:var(--accent);transition:none;animation:none}
.card.over{border-color:var(--accent);border-style:dashed;background:var(--accent-soft)}
.card.anim{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.card.flash{animation:flash .8s ease}
.effort-line{margin:0;font-size:13px;color:var(--muted)}
.effort-line b{color:var(--fg);font-weight:600}
.cardbody{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:9px 6px 9px 9px;text-align:left;border-radius:18px}
.cardbody[disabled]{cursor:default}
.card .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.card .dname{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.15}
.grip{align-self:stretch;display:flex;align-items:center;padding:0 12px 0 6px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;border-radius:0 18px 18px 0}
.grip:active{cursor:grabbing;color:var(--accent-ink)}
.grip:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.link.quiet{color:var(--muted);font-weight:500;font-size:12px;padding:0}
.eyebrow-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.replacing{display:flex;align-items:center;gap:12px}
/* larger screens: keep the phone column, present it as a device-sized card */
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center;padding-block:24px;padding-inline:16px;background:var(--desk)}
  .app{height:min(880px,100%);width:100%;max-width:410px;border-radius:30px;border:1px solid var(--line);overflow:hidden;box-shadow:0 20px 50px rgba(70,35,10,.14)}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<style>.app{height:100vh;height:100dvh}@media (min-width:600px){.app{height:min(880px,calc(100dvh - 48px))}}</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage"><main class="screen" id="screen"></main></div>
  <div id="footer"></div>

    <button role="tab" id="tab-week" aria-selected="true" data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>This week</button>
    <button role="tab" id="tab-dishes" aria-selected="false" data-tab="dishes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>Our dishes</button>
  </nav>
</div>

const EFFORT = {1:'Easy',2:'Mid',3:'Hard',4:'Extra hard'};
const SEED = [
  {id:'fried_rice',name:'Fried rice',effort:2},
  {id:'beef_noodle',name:'Beef noodle soup',effort:1},
  {id:'eggplant_and_pork',name:'Eggplant & pork',effort:3},
  {id:'cabbage_with_pork_belly',name:'Cabbage with pork belly',effort:3},
  {id:'seafood_noodles',name:'Seafood noodles',effort:2},
  {id:'braised_chicken',name:'Braised chicken',effort:3},
  {id:'salmon',name:'Salmon & broccoli',effort:1},
  {id:'baozi',name:'Baozi',effort:4},
].map(d=>({...d,img:IMGS[d.id]}));
const OFF = {id:'off',name:'Night off',effort:0};
const DAYS = ['Mon','Tue','Wed','Thu','Fri'];
const FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday'];

const store = {
  get(k,f){try{const v=localStorage.getItem('twoplates:'+k);return v?JSON.parse(v):f}catch(e){return f}},
  set(k,v){try{localStorage.setItem('twoplates:'+k,JSON.stringify(v))}catch(e){}}
};
let S = {
  tab:'week', view:null, week:'this',
  dishes: store.get('dishes', SEED),
  plans: store.get('plans', {this:null,next:null}),   // each: {ids:[5], changesLeft, locked}
};
const save=()=>{store.set('dishes',S.dishes);store.set('plans',S.plans)};
const byId = id => id==='off'?OFF:(S.dishes.find(d=>d.id===id)||OFF);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plan = () => S.plans[S.week];
// the week we try not to repeat: next week avoids this week
const avoidIds = () => S.week==='next' && S.plans.this ? S.plans.this.ids.filter(id=>id!=='off') : [];

/* ---------- the generator: constrained randomness ---------- */
function generate(){
  const avoid = new Set(avoidIds());
  const fresh = d => !avoid.has(d.id);
  const rank = list => [...shuffle(list.filter(fresh)), ...shuffle(list.filter(d=>!fresh(d)))];
  const heavy = rank(S.dishes.filter(d=>d.effort>=3));
  const light = rank(S.dishes.filter(d=>d.effort<=2));
  const fri = heavy.shift();                                   // at most one big cook, saved for Friday
  let monThu = light.splice(0,4);
  if(monThu.length<4) monThu = monThu.concat(heavy.splice(0,4-monThu.length));
  monThu = shuffle(monThu);
  const e = monThu.findIndex(d=>d.effort===1); if(e>0) [monThu[0],monThu[e]]=[monThu[e],monThu[0]];
  let week = fri ? [...monThu, fri] : monThu.concat(light).slice(0,5);
  while(week.length<5) week.push(OFF);
  S.plans[S.week] = {ids:week.map(d=>d.id), changesLeft:2, locked:false};
  save();
}
function explain(){
  const p=plan(), c={1:0,2:0,3:0,4:0}; let off=0;
  p.ids.forEach(id=>{const d=byId(id); if(id==='off') off++; else c[d.effort]++});
  const parts=[]; if(c[1]) parts.push(`${c[1]} easy`); if(c[2]) parts.push(`${c[2]} mid`); if(off) parts.push(`${off} night${off>1?'s':''} off`);
  const heavy = p.ids.map((id,i)=>[byId(id),i]).filter(([d])=>d.effort>=3);
  const heavyTxt = heavy.length===1 ? `big cook on ${FULL[heavy[0][1]]}` : heavy.length ? `${heavy.length} big cooks` : '';
  let rep='';
  if(S.week==='next' && S.plans.this){ const r=p.ids.filter(id=>avoidIds().includes(id)).length;
    rep = r===0 ? ' · no repeats from this week' : ` · ${r} repeat${r>1?'s':''} from this week`; }
  return [...parts, heavyTxt].filter(Boolean).join(' · ') + rep;
}
function swapDays(a,b){ const ids=plan().ids; [ids[a],ids[b]]=[ids[b],ids[a]]; save(); flashDays=[a,b]; toast(`Swapped ${DAYS[a]} and ${DAYS[b]}`); render(); }
function change(day,id){ const p=plan(); if(p.changesLeft<=0) return; p.ids[day]=id; p.changesLeft--; save(); flashDays=[day];
  toast(p.changesLeft?`${p.changesLeft} change left`:'No changes left. You can still drag to swap.'); render(); }
let flashDays=[], justGenerated=false;

/* ---------- views ---------- */
const plate=(d,size)=> d.id==='off'
  ? `<span class="off-plate" style="width:${size}px;height:${size}px"><svg width="${size*.38}" height="${size*.38}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span>`
  : `<img class="plate" src="${d.img}" alt="" style="width:${size}px;height:${size}px">`;
const chip=d=> d.id==='off'?`<span class="chip eoff">Eat out or order in</span>`:`<span class="chip"><span class="pp">${[1,2,3,4].map(p=>`<i class="${p<=d.effort?'on':''}"></i>`).join('')}</span>${EFFORT[d.effort]}</span>`;
function weekDates(offset){
  const now=new Date(), dow=now.getDay(); const mon=new Date(now);
  mon.setDate(now.getDate() - ((dow+6)%7) + (dow===0||dow===6?7:0) + (offset?7:0));
  return DAYS.map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d});
}
function todayIdx(){const t=new Date();return weekDates(0).findIndex(d=>d.toDateString()===t.toDateString())}
const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const GRIP='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';

function renderWeek(){
  const ds=weekDates(S.week==='next'), range=`${fmt(ds[0])} – ${fmt(ds[4])}`;
  const sc=$('#screen'), ft=$('#footer'), p=plan();
  const seg=`<div class="seg" role="tablist" aria-label="Which week">
      <button role="tab" id="seg-this" aria-selected="${S.week==='this'}" data-w="this">This week${S.plans.this?.locked?' <span class="dot"></span>':''}</button>
      <button role="tab" id="seg-next" aria-selected="${S.week==='next'}" data-w="next">Next week${S.plans.next?.locked?' <span class="dot"></span>':''}</button></div>`;
  const reset=`<button class="link quiet" id="reset">Reset demo</button>`;
  const head=`<div class="eyebrow-row"><span class="eyebrow">${range}</span>${reset}</div><div class="top" style="margin-top:-12px"><h1>${S.week==='this'?'This week':'Next week'}</h1>
    ${p?.locked?`<span class="locked-note"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Locked</span>`:''}</div>${seg}`;
  if(!p){
    const sample=shuffle(S.dishes).slice(0,5);
    const note = S.week==='next' && S.plans.this ? `We'll keep it different from this week.` : `Balanced so the week isn't all big cooks.`;
    sc.innerHTML=`${head}<div class="empty">
      <div class="peek">${sample.map(d=>`<img class="plate" src="${d.img}" alt="">`).join('')}</div>
      <div style="display:flex;flex-direction:column;gap:8px"><h1 style="font-size:26px">What's for dinner?</h1>
      <p class="sub">We'll pick five dinners from the ${S.dishes.length} dishes you two already cook. ${note}</p></div>
      <button class="btn" id="gen">Plan ${S.week==='this'?'our week':'next week'}</button></div>`;
    ft.innerHTML='';
    $('#gen').onclick=()=>{generate();justGenerated=true;render()};
  } else {
    const locked=p.locked, ti=S.week==='this'?todayIdx():-1, n=p.changesLeft;
    sc.innerHTML=`${head}
      ${locked?`<p class="sub" style="margin:-4px 0 0">Decided for both of you. No more debating.</p>`:`<div class="why"><span><b>One change each.</b> Take turns swapping out a dish you're not feeling, then lock it in together.</span></div>
      <p class="effort-line">${explain()}</p>
      <p class="hint">${n?'Tap a dish to change it. Drag':'Changes used up. Drag'} <span class="hint-grip">${GRIP}</span> to swap days.</p>`}
      <div class="slots">${p.ids.map((id,i)=>{const d=byId(id);return `
        <div class="slot" data-day="${i}">
          <div class="dcol ${i===ti?'today':''}"><span class="dd">${DAYS[i]}</span><span class="dn">${ds[i].getDate()}</span>${i===ti?'<span class="tt">Today</span>':''}</div>
          <div class="card ${justGenerated?'anim':''} ${flashDays.includes(i)?'flash':''} ${locked?'is-locked':''}" data-day="${i}" style="${justGenerated?`animation-delay:${i*55}ms`:''}">
            <button class="cardbody" data-day="${i}" ${locked?'disabled':''} aria-label="${locked?'':'Change '+FULL[i]}">
              ${plate(d,58)}<span class="meta"><span class="dname">${esc(d.name)}</span><span>${chip(d)}</span></span></button>
            ${locked?'':`<span class="grip" data-day="${i}" aria-label="Drag to swap ${FULL[i]}" role="button" tabindex="0">${GRIP}</span>`}
          </div></div>`}).join('')}</div>`;
    flashDays=[]; justGenerated=false;
    if(!locked){
      ft.innerHTML=`<div class="bar"><div class="pill" title="Fewer choices, less fatigue"><span class="dots"><i class="${n<2?'used':''}"></i><i class="${n<1?'used':''}"></i></span>${n} change${n===1?'':'s'} left</div><button class="btn" id="lock">Lock in</button></div>`;
      $('#lock').onclick=()=>{p.locked=true;save();toast('Locked in. Fewer choices, less fatigue.');render()};
      $$('.cardbody').forEach(b=>b.onclick=()=>{ if(plan().changesLeft<=0) return toast('No changes left. Drag to swap days.'); openSheet(+b.dataset.day) });
      $$('.grip').forEach(initDrag);
    } else ft.innerHTML='';
  }
  $$('.seg button').forEach(b=>b.onclick=()=>{S.week=b.dataset.w;render()});
  $('#reset').onclick=()=>{S.dishes=SEED;S.plans={this:null,next:null};S.week='this';save();toast('Demo reset');render()};
}

/* drag to swap: pointer events so it works with touch and mouse */
function initDrag(grip){
  grip.onkeydown=e=>{const i=+grip.dataset.day; if(e.key==='ArrowUp'&&i>0){e.preventDefault();swapDays(i,i-1)} if(e.key==='ArrowDown'&&i<4){e.preventDefault();swapDays(i,i+1)}};
  grip.onpointerdown=e=>{
    e.preventDefault();
    const from=+grip.dataset.day, card=grip.closest('.card'), cards=$$('.card'), y0=e.clientY;
    let target=from; grip.setPointerCapture(e.pointerId); card.classList.add('dragging');
    const move=ev=>{ card.style.transform=`translateY(${ev.clientY-y0}px)`;
      target=from; cards.forEach((c,k)=>{ if(k===from) return; const r=c.getBoundingClientRect(); const hit=ev.clientY>r.top&&ev.clientY<r.bottom; c.classList.toggle('over',hit); if(hit) target=k; }); };
    const up=()=>{ grip.removeEventListener('pointermove',move); grip.removeEventListener('pointerup',up); grip.removeEventListener('pointercancel',up);
      cards.forEach(c=>c.classList.remove('over')); card.classList.remove('dragging'); card.style.transform='';
      if(target!==from) swapDays(from,target); };
    grip.addEventListener('pointermove',move); grip.addEventListener('pointerup',up); grip.addEventListener('pointercancel',up);
  };
}

function openSheet(i){
  const p=plan(), cur=byId(p.ids[i]), n=p.changesLeft;
  const opts=[...S.dishes.filter(d=>!p.ids.includes(d.id)), ...(p.ids[i]!=='off'?[OFF]:[])];
  const el=document.createElement('div'); el.className='scrim'; el.id='scrim';
  el.innerHTML=`<div class="sheet" role="dialog" aria-label="Change ${FULL[i]}">
    <div class="grab"></div>
    <div class="replacing">${plate(cur,44)}<div><h2>Change ${FULL[i]}</h2><p class="sub" style="margin:2px 0 0">Replacing ${esc(cur.name)}. Uses 1 of your ${n} change${n>1?'s':''}.</p></div></div>
    <div class="opts">${opts.map(d=>`<button class="opt" data-id="${d.id}">${plate(d,76)}<span class="n">${esc(d.name)}</span>${chip(d)}</button>`).join('')}</div>
    <button class="btn ghost" id="cancelSheet">Keep ${esc(cur.name)}</button>
  </div>`;
  $('#app').appendChild(el);
  el.onclick=e=>{ if(e.target===el) el.remove() };
  $('#cancelSheet').onclick=()=>el.remove();
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{el.remove();change(i,b.dataset.id)});
}

function renderDishes(){
  const sc=$('#screen'); $('#footer').innerHTML='';
  if(S.view==='add') return renderAdd();
  sc.innerHTML=`<div class="top"><div><div class="eyebrow">${S.dishes.length} dishes we cook</div><h1>Our dishes</h1></div></div>
    <p class="sub" style="margin:-6px 0 0">Tap a dish to edit its effort.</p><div class="grid">${S.dishes.map(d=>`<button class="dish" data-id="${d.id}" aria-label="Edit ${esc(d.name)}"><img class="plate" src="${d.img}" alt=""><span class="n">${esc(d.name)}</span>${chip(d)}</button>`).join('')}</div>
    <div style="height:64px"></div>`;
  const fab=document.createElement('button'); fab.className='fab'; fab.id='fab'; fab.setAttribute('aria-label','Add a dish');
  fab.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  fab.onclick=()=>{S.view='add';render()};
  $$('.dish').forEach(b=>b.onclick=()=>openEdit(b.dataset.id));
  $('#stage').appendChild(fab);
}


function openEdit(id){
  const d=S.dishes.find(x=>x.id===id); let eff=d.effort;
  const el=document.createElement('div'); el.className='scrim'; el.id='scrim';
  el.innerHTML=`<div class="sheet" role="dialog" aria-label="Edit ${esc(d.name)}">
    <div class="grab"></div>
    <div class="replacing">${plate(d,56)}<h2>Edit dish</h2></div>
    <div class="field"><label for="ename">Name</label><input type="text" id="ename" value="${esc(d.name)}" autocomplete="off"></div>
    <div class="field"><span class="lbl">How much effort is it for you?</span>
      <div class="efforts">${[1,2,3,4].map(v=>`<button data-e="${v}" aria-pressed="${eff===v}"><span class="pips">${[1,2,3,4].map(p=>`<i class="${p<=v?'on':''}"></i>`).join('')}</span>${EFFORT[v]}</button>`).join('')}</div></div>
    <div class="err" id="eerr"></div>
    <button class="btn" id="esave">Save changes</button>
    <button class="del" id="edel">Delete dish</button>
  </div>`;
  $('#app').appendChild(el);
  el.onclick=e=>{ if(e.target===el) el.remove() };
  el.querySelectorAll('.efforts button').forEach(b=>b.onclick=()=>{eff=+b.dataset.e;el.querySelectorAll('.efforts button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#ename').oninput=()=>{$('#eerr').textContent=''};
  let armed=false;
  $('#edel').onclick=()=>{
    const where=[]; ['this','next'].forEach(w=>{const p=S.plans[w]; if(p) p.ids.forEach((x,i)=>{if(x===id) where.push({w,i})})});
    if(!armed){ armed=true;
      $('#edel').textContent='Tap again to delete';
      $('#eerr').textContent = where.length ? `${d.name} is planned for ${where.map(o=>`${FULL[o.i]} (${o.w==='this'?'this':'next'} week)`).join(' and ')}. That day becomes a night off.` : `This removes ${d.name} from your dishes.`;
      return; }
    where.forEach(o=>{S.plans[o.w].ids[o.i]='off'});
    S.dishes=S.dishes.filter(x=>x.id!==id); save(); el.remove(); toast(`${d.name} deleted`); render();
  };
  $('#esave').onclick=()=>{const name=$('#ename').value.trim(); if(!name) return $('#eerr').textContent='Give the dish a name.';
    d.name=name; d.effort=eff; S.dishes=[...S.dishes]; save(); el.remove(); toast(`${name} updated. Next plan uses the new effort.`); render()};
}

let draft={img:null,name:'',effort:0};
function renderAdd(){
  const sc=$('#screen');
  sc.innerHTML=`<button class="back" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>Our dishes</button>
    <h1>New dish</h1>
    <label class="photo-in" for="photo">${draft.img?`<img src="${draft.img}" alt="">`:`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Add a photo`}<input type="file" id="photo" accept="image/*"></label>
    <div class="field"><label for="dname">Name</label><input type="text" id="dname" placeholder="e.g. Tomato and egg" value="${esc(draft.name)}" autocomplete="off"></div>
    <div class="field"><span class="lbl">How much effort is it for you?</span>
      <div class="efforts">${[1,2,3,4].map(v=>`<button class="v${v}" data-e="${v}" aria-pressed="${draft.effort===v}"><span class="pips">${[1,2,3,4].map(p=>`<i class="${p<=v?'on':''}"></i>`).join('')}</span>${EFFORT[v]}</button>`).join('')}</div></div>
    <div class="err" id="err"></div>
    <button class="btn" id="saveDish">Save dish</button>`;
  $('#back').onclick=()=>{S.view=null;draft={img:null,name:'',effort:0};render()};
  $('#dname').oninput=e=>{draft.name=e.target.value;$('#err').textContent=''};
  $$('.efforts button').forEach(b=>b.onclick=()=>{draft.effort=+b.dataset.e;$$('.efforts button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#err').textContent=''});
  $('#photo').onchange=e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{const im=new Image(); im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=320;
      c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,320,320); draft.img=c.toDataURL('image/jpeg',.75); draft.name=$('#dname').value; renderAdd()}; im.src=r.result}; r.readAsDataURL(f)};
  $('#saveDish').onclick=()=>{
    const name=$('#dname').value.trim();
    if(!draft.img) return $('#err').textContent='Add a photo so you can recognize it at a glance.';
    if(!name) return $('#err').textContent='Give the dish a name.';
    if(!draft.effort) return $('#err').textContent='Pick an effort level. It keeps the week balanced.';
    S.dishes=[...S.dishes,{id:'d'+Date.now(),name,effort:draft.effort,img:draft.img}];
    save(); draft={img:null,name:'',effort:0}; S.view=null; toast(`${name} added`); render();
  };
}

function toast(msg){$$('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#app').appendChild(t);setTimeout(()=>t.remove(),2200)}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function render(){
  $('#fab')&&$('#fab').remove();
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  $('#screen').scrollTop=0;
  S.tab==='week'?renderWeek():renderDishes();
}
$$('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.view=null;$('#scrim')&&$('#scrim').remove();render()});
render();
</script>

</body>
